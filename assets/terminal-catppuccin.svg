<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="arch hyprland catppuccin terminal">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace; white-space: pre; }
    .k { fill-opacity: 0; animation: k .01s var(--t) forwards; }
    @keyframes k { to { fill-opacity: 1; } }
    .show { opacity: 0; animation: show .01s var(--t) forwards; }
    @keyframes show { to { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .glyph { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .42; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .k { fill-opacity: 1; } .show { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11111b"/><stop offset=".6" stop-color="#181825"/><stop offset="1" stop-color="#2a1f3d"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/><stop offset=".5" stop-color="#89b4fa"/><stop offset="1" stop-color="#f5c2e7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cba6f7"/><stop offset="1" stop-color="#89b4fa"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#wall)"/>
    <!-- waybar -->
    <rect x="12" y="7" width="138" height="28" rx="14" fill="#1e1e2e"/>
    <rect x="26" y="15" width="28" height="12" rx="6" fill="#cba6f7"/><circle cx="66" cy="21" r="5" fill="#585b70"/><circle cx="86" cy="21" r="5" fill="#585b70"/><circle cx="106" cy="21" r="5" fill="#585b70"/><circle cx="126" cy="21" r="5" fill="#585b70"/>
    <rect x="545" y="7" width="110" height="28" rx="14" fill="#1e1e2e"/>
    <text x="600" y="26" text-anchor="middle" style="font-size:14px;font-weight:700" fill="#cdd6f4">09:41</text>
    <rect x="1040" y="7" width="148" height="28" rx="14" fill="#1e1e2e"/>
    <circle cx="1060" cy="21" r="4" fill="#a6e3a1"/><circle cx="1076" cy="21" r="4" fill="#fab387"/><circle cx="1092" cy="21" r="4" fill="#89b4fa"/>
    <text x="1170" y="26" text-anchor="end" style="font-size:13px" fill="#bac2de">cpu 4%</text>

    <!-- kitty window with animated Hyprland-style gradient border -->
    <rect x="12" y="44" width="1176" height="244" rx="12" fill="#1e1e2e" fill-opacity=".96" stroke="url(#border)" stroke-width="2.5"/>

    <text x="40" y="92" style="font-size:21px"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan fill="#cdd6f4"><tspan class="k" style="--t:0.50s">w</tspan><tspan class="k" style="--t:0.59s">h</tspan><tspan class="k" style="--t:0.68s">o</tspan><tspan class="k" style="--t:0.77s">a</tspan><tspan class="k" style="--t:0.86s">m</tspan><tspan class="k" style="--t:0.95s">i</tspan></tspan></text>
    <text class="show" style="--t:1.39s;font-size:21px" x="40" y="128" fill="#bac2de">just someone who likes building things</text>
    <text class="show" style="--t:1.89s;font-size:21px" x="40" y="164"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan fill="#cdd6f4"><tspan class="k" style="--t:2.29s">c</tspan><tspan class="k" style="--t:2.38s">a</tspan><tspan class="k" style="--t:2.47s">t</tspan><tspan class="k" style="--t:2.56s"> </tspan><tspan class="k" style="--t:2.65s">m</tspan><tspan class="k" style="--t:2.74s">o</tspan><tspan class="k" style="--t:2.83s">t</tspan><tspan class="k" style="--t:2.92s">t</tspan><tspan class="k" style="--t:3.01s">o</tspan><tspan class="k" style="--t:3.10s">.</tspan><tspan class="k" style="--t:3.19s">t</tspan><tspan class="k" style="--t:3.28s">x</tspan><tspan class="k" style="--t:3.37s">t</tspan></tspan></text>
    <text class="show" style="--t:3.81s;font-size:21px" x="40" y="200" fill="#cba6f7">coffee → code → repeat</text>
    <text class="show" style="--t:4.31s;font-size:21px" x="40" y="236"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan class="cur" fill="#f5e0dc">█</tspan></text>

    <text class="glyph" x="1000" y="214" text-anchor="middle" style="font-size:130px;font-weight:700" fill="url(#gl)">&lt;/&gt;</text>
  </g>
</svg>
