<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-label="terminal with tech stack">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace; white-space: pre; font-size: 17px; }
    .big { font-size: 20px; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .glyph { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .42; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="644" rx="14"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11111b"/><stop offset=".6" stop-color="#181825"/><stop offset="1" stop-color="#2a1f3d"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/><stop offset=".5" stop-color="#89b4fa"/><stop offset="1" stop-color="#f5c2e7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cba6f7"/><stop offset="1" stop-color="#89b4fa"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="644" fill="url(#wall)"/>

    <!-- waybar -->
    <rect x="12" y="7" width="138" height="28" rx="14" fill="#1e1e2e"/>
    <rect x="26" y="15" width="28" height="12" rx="6" fill="#cba6f7"/><circle cx="66" cy="21" r="5" fill="#585b70"/><circle cx="86" cy="21" r="5" fill="#585b70"/><circle cx="106" cy="21" r="5" fill="#585b70"/><circle cx="126" cy="21" r="5" fill="#585b70"/>
    <rect x="545" y="7" width="110" height="28" rx="14" fill="#1e1e2e"/>
    <text x="600" y="26" text-anchor="middle" style="font-size:14px;font-weight:700" fill="#cdd6f4">09:41</text>
    <rect x="1040" y="7" width="148" height="28" rx="14" fill="#1e1e2e"/>
    <circle cx="1060" cy="21" r="4" fill="#a6e3a1"/><circle cx="1076" cy="21" r="4" fill="#fab387"/><circle cx="1092" cy="21" r="4" fill="#89b4fa"/>
    <text x="1170" y="26" text-anchor="end" style="font-size:13px" fill="#bac2de">cpu 4%</text>

    <rect x="12" y="44" width="1176" height="588" rx="12" fill="#1e1e2e" fill-opacity=".96" stroke="url(#border)" stroke-width="2.5"/>

    <text class="big" x="40" y="90"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan fill="#cdd6f4">whoami</tspan></text>
    <text class="big" x="40" y="124" fill="#bac2de">just someone who likes building things</text>
    <text class="big" x="40" y="158"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan fill="#cdd6f4">cat motto.txt</tspan></text>
    <text class="big" x="40" y="192" fill="#cba6f7">coffee → code → repeat</text>
    <text class="big" x="40" y="236"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan fill="#cdd6f4">tree ~/stack</tspan></text>

        <text x="40" y="267"><tspan fill="#89b4fa" font-weight="700">~/stack</tspan></text>
    <text x="40" y="294"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">language/</tspan></text>
    <text x="40" y="321"><tspan fill="#585b70">│   ├── </tspan><tspan fill="#94e2d5">major</tspan>       <tspan fill="#5a9fd4">●</tspan> <tspan fill="#cdd6f4">python</tspan>  <tspan fill="#f89820">●</tspan> <tspan fill="#cdd6f4">java</tspan>  <tspan fill="#f7df1e">●</tspan> <tspan fill="#cdd6f4">javascript</tspan>  <tspan fill="#89b4fa">●</tspan> <tspan fill="#cdd6f4">sql</tspan></text>
    <text x="40" y="348"><tspan fill="#585b70">│   ├── </tspan><tspan fill="#94e2d5">available</tspan>   <tspan fill="#a97bff">●</tspan> <tspan fill="#cdd6f4">kotlin</tspan></text>
    <text x="40" y="375"><tspan fill="#585b70">│   └── </tspan><tspan fill="#94e2d5">learning</tspan>    <tspan fill="#c77dbf">●</tspan> <tspan fill="#cdd6f4">c# (unity)</tspan></text>
    <text x="40" y="402"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">frontend/</tspan>       <tspan fill="#61dafb">●</tspan> <tspan fill="#cdd6f4">react</tspan>  <tspan fill="#61dafb">●</tspan> <tspan fill="#cdd6f4">react-native</tspan></text>
    <text x="40" y="429"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">backend/</tspan>        <tspan fill="#e6e9ef">●</tspan> <tspan fill="#cdd6f4">flask</tspan>  <tspan fill="#26b5a5">●</tspan> <tspan fill="#cdd6f4">fastapi</tspan>  <tspan fill="#6db33f">●</tspan> <tspan fill="#cdd6f4">spring-boot</tspan>  <tspan fill="#6db33f">●</tspan> <tspan fill="#cdd6f4">spring-jpa</tspan>  <tspan fill="#6db33f">●</tspan> <tspan fill="#cdd6f4">spring-security</tspan>  <tspan fill="#6db33f">●</tspan> <tspan fill="#cdd6f4">spring-cloud</tspan></text>
    <text x="40" y="456"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">database/</tspan>       <tspan fill="#3fa9c4">●</tspan> <tspan fill="#cdd6f4">mysql</tspan>  <tspan fill="#47a248">●</tspan> <tspan fill="#cdd6f4">mongodb</tspan>  <tspan fill="#f05a4f">●</tspan> <tspan fill="#cdd6f4">redis</tspan>  <tspan fill="#f04d4d">●</tspan> <tspan fill="#cdd6f4">oracle-db</tspan></text>
    <text x="40" y="483"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">devops/</tspan>         <tspan fill="#ff9900">●</tspan> <tspan fill="#cdd6f4">aws</tspan>  <tspan fill="#4285f4">●</tspan> <tspan fill="#cdd6f4">google-cloud</tspan>  <tspan fill="#2fbf5f">●</tspan> <tspan fill="#cdd6f4">nginx</tspan>  <tspan fill="#2496ed">●</tspan> <tspan fill="#cdd6f4">docker</tspan>  <tspan fill="#ffca28">●</tspan> <tspan fill="#cdd6f4">firebase</tspan></text>
    <text x="40" y="510"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">misc/</tspan>           <tspan fill="#f05032">●</tspan> <tspan fill="#cdd6f4">git</tspan>  <tspan fill="#2088ff">●</tspan> <tspan fill="#cdd6f4">github-actions</tspan>  <tspan fill="#74aa9c">●</tspan> <tspan fill="#cdd6f4">chatgpt</tspan>  <tspan fill="#43b02a">●</tspan> <tspan fill="#cdd6f4">selenium</tspan>  <tspan fill="#7289da">●</tspan> <tspan fill="#cdd6f4">discord.py</tspan></text>
    <text x="40" y="537"><tspan fill="#585b70">├── </tspan><tspan fill="#89b4fa" font-weight="700">ide/</tspan>            <tspan fill="#21d789">●</tspan> <tspan fill="#cdd6f4">pycharm</tspan>  <tspan fill="#fe315d">●</tspan> <tspan fill="#cdd6f4">intellij-idea</tspan>  <tspan fill="#23a8f2">●</tspan> <tspan fill="#cdd6f4">vscode</tspan></text>
    <text x="40" y="564"><tspan fill="#585b70">└── </tspan><tspan fill="#89b4fa" font-weight="700">tools/</tspan>          <tspan fill="#5391fe">●</tspan> <tspan fill="#cdd6f4">powershell-7</tspan>  <tspan fill="#e04848">●</tspan> <tspan fill="#cdd6f4">filezilla</tspan>  <tspan fill="#ff6c37">●</tspan> <tspan fill="#cdd6f4">postman</tspan>  <tspan fill="#a259ff">●</tspan> <tspan fill="#cdd6f4">figma</tspan></text>

    <text class="big" x="40" y="604"><tspan fill="#89b4fa" font-weight="700">~ </tspan><tspan fill="#a6e3a1" font-weight="700">❯ </tspan><tspan class="cur" fill="#f5e0dc">_</tspan></text>

    <text class="glyph" x="1000" y="200" text-anchor="middle" style="font-size:130px;font-weight:700;letter-spacing:-20px" fill="url(#gl)">&lt;/&gt;</text>
  </g>
</svg>
